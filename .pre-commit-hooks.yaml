# ci-truth-serum — pre-commit hook definitions.
#
# Each lint is exposed as its own hook `id` so consumers can enable subsets.
# Hooks are grouped Tier 1 (honesty + identity, default-on) / Tier 2 (opinionated,
# opt-in) / Extras (off-theme bonus). Tier 2 and Extras are NEVER required by
# Tier 1 — enable only the ids you want.
#
# `language: python` builds an isolated env and installs this package (which
# pulls in PyYAML); the YAML lints additionally pin PyYAML under
# `additional_dependencies` so the intent is explicit. Each entry runs the lint
# as `python -m ci_truth_serum.<module>` from the consumer's repo root.
#
# Prefer one whole tier? Enable a single `check-tier1` / `check-tier2` /
# `check-extras` aggregate (bottom of this file) instead of listing each id; a
# check added to that tier later is then picked up with no consumer change.

# ───────────────────────── Tier 1 · Honesty (default-on) ─────────────────────
- id: check-workflow-pipefail
  name: "honesty: enforce pipefail on piped run/runCmd steps"
  description: A pipe in a non-pipefail shell masks a failing left-hand command.
  entry: python -m ci_truth_serum.check_workflow_pipefail
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-exit-suppression
  name: "honesty: ban unjustified exit-status suppression (|| true / || :)"
  description: "`cmd || true` drops a real failure while keeping its output."
  entry: python -m ci_truth_serum.check_exit_suppression
  language: python
  types: [shell]

- id: check-stderr-suppression
  name: "honesty: ban stderr suppression on container launch/build commands"
  description: 2>/dev/null on a launch hides the only diagnostic a bare non-zero leaves.
  entry: python -m ci_truth_serum.check_stderr_suppression
  language: python
  types: [shell]

- id: check-substitution-exit-swallow
  name: "honesty: ban jq/yq feeding a shell loop through an exit-swallowing construct"
  description: "`done < <(jq …)` / `jq … | while` discards jq/yq's exit, so a query/data error no-ops the loop yet reports success."
  entry: python -m ci_truth_serum.check_substitution_exit_swallow
  language: python
  types: [shell]

- id: check-argument-exit-swallow
  name: "honesty: ban a command substitution passed as an argument to a local function"
  description: '`f "$(cmd)"` discards cmd''s exit status, so `set -e` never stops the script. This is SC2155 one step over, and shellcheck does not report it.'
  entry: python -m ci_truth_serum.check_argument_exit_swallow
  language: python
  types: [shell]

- id: check-soft-timeout
  name: "honesty: ban a `timeout` bound with no SIGKILL escalation"
  description: "`timeout 60 cmd` sends only SIGTERM, which the command can ignore; it then outlives the bound and the wait it was supposed to end goes on."
  entry: python -m ci_truth_serum.check_soft_timeout
  language: python
  additional_dependencies: [tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-flock-fixed-fd
  name: "honesty: ban a lock taken on a hardcoded file descriptor"
  description: "`flock -x 9` in a file that never opens fd 9 locks whatever that number is. When nothing opened it, `flock` exits non-zero. When something else holds it, the lock guards a different file and both runs still report success."
  entry: python -m ci_truth_serum.check_flock_fixed_fd
  language: python
  additional_dependencies: [tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-pr-paths
  name: "honesty: ban paths/branches filters on pull_request triggers"
  description: A paths or branches filter strands a required check at "Expected — Waiting" forever.
  entry: python -m ci_truth_serum.check_pr_paths
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-frozen-head-sha
  name: "honesty: ban github.event.pull_request.head.sha in a range or a checkout"
  description: The event head SHA is frozen at trigger time; a force-push/autofix-amend mis-scopes a diff range or checks out a stale commit. Derive the head from the checkout. An env var binding it is judged by what spends it.
  entry: python -m ci_truth_serum.check_frozen_head_sha
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-ready-for-review
  name: "honesty: a draft-gated workflow must fire on ready_for_review"
  description: A workflow that skips jobs while the pull request is a draft defers them. ready_for_review is not a default activity type, so the jobs never run and their skipped check runs count as satisfied.
  entry: python -m ci_truth_serum.check_ready_for_review
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-pipefail-grep-pipe
  name: "honesty: ban a tested pipeline that ends in an early-exit reader under set -o pipefail (SIGPIPE false-negative)"
  description: A reader that answers early SIGPIPEs the producer. Pipefail then surfaces 141, so a match reads as no-match.
  entry: python -m ci_truth_serum.check_pipefail_grep_pipe
  language: python
  additional_dependencies: [tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-gh-slurp-jq
  name: "honesty: ban the `gh api --slurp` flag combinations gh refuses to run"
  description: "`--slurp` with `--jq`/`--template`, or `--slurp` without `--paginate`, is rejected at argument validation — the call has never worked, and a site that swallows it reads as a permanent green."
  entry: python -m ci_truth_serum.check_gh_slurp_jq
  language: python
  types_or: [shell, yaml]

- id: check-folded-scalar-comment
  name: "honesty: ban a `#` comment line inside a folded YAML block scalar"
  description: A folded scalar has no comment syntax, so the line joins the value — and shell word-splitting then discards every argument after the `#`.
  entry: python -m ci_truth_serum.check_folded_scalar_comment
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-runner-var-foreign-shell
  name: "honesty: no runner variable in a shell GitHub does not set up"
  description: GITHUB_OUTPUT, GITHUB_ENV, GITHUB_PATH and GITHUB_STEP_SUMMARY name files on the runner. A shell GitHub does not set up can run the script in a container or on another host. The write then reaches no file the runner reads. The step still exits 0, and the result stays empty.
  entry: python -m ci_truth_serum.check_runner_var_foreign_shell
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-truncating-pr-json
  name: "honesty: refuse a `gh pr` --json read of a field GitHub truncates at 100"
  description: "`gh pr view --json files` asks GraphQL for `files(first: 100)` with no cursor, so past 100 entries gh exits 0 with a short list and nothing in the response says so. Reads shell, inline workflow `run:` blocks, and Python `subprocess` calls."
  entry: python -m ci_truth_serum.check_truncating_pr_json
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types_or: [shell, python, yaml]

# ───────────────────────── Tier 1 · Identity (default-on) ────────────────────
- id: check-pinned-base-images
  name: "identity: enforce digest-pinned Docker base images"
  description: A mutable tag (stronger than hadolint's tag-only rule) lets the bytes drift.
  entry: python -m ci_truth_serum.check_pinned_base_images
  language: python
  files: '(^|/)Dockerfile(\.[\w-]+)?$'

- id: check-pinned-downloads
  name: "identity: enforce checksum/signature on downloaded artifacts"
  description: An unverified curl/wget that you then run is a supply-chain entry point.
  entry: python -m ci_truth_serum.check_pinned_downloads
  language: python
  files: '\.(sh|bash)$|(^|/)Dockerfile(\.[\w-]+)?$'

- id: check-versionless-install
  name: "identity: every install command must name a version"
  description: A versionless `pip install pkg` / `apt-get install pkg` resolves to whatever the index serves that day.
  entry: python -m ci_truth_serum.check_versionless_install
  language: python
  files: '\.(sh|bash)$|(^|/)\.github/(workflows|actions)/.*\.ya?ml$'

- id: check-provenance-repo-url
  name: "identity: package repository URLs must name the repo that publishes"
  description: A repository.url naming another owner/repo (a fork's stale upstream URL) kills the release at npm's provenance validation (E422).
  entry: python -m ci_truth_serum.check_provenance_repo_url
  language: python
  pass_filenames: false
  # The compared value (the publishing repo) can change with no file edit, and
  # a clean repo costs one git call plus two small file reads — always run.
  always_run: true

# ───────────────────────── Tier 1 · Security (default-on) ────────────────────
- id: check-trusted-base
  name: "security: forbid privileged checkout of an author-chosen ref (pwn-request)"
  description: A pull_request(_target) job that checks out an author-chosen ref — the PR head, or the PR's own BASE branch — AND holds write perms or a secret runs untrusted PR code with the base repo's privileges.
  entry: python -m ci_truth_serum.check_trusted_base
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-untrusted-exec
  name: "security: forbid executing an untrusted checkout while secrets are live"
  description: A job that checks out a PR head and then runs a local composite action, a package-manager script, or a workspace-relative path hands the PR author every secret in that job.
  entry: python -m ci_truth_serum.check_untrusted_exec
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-unscoped-tool-grant
  name: "security: ban an unscoped or inert file-tool rule in a Claude Code tool grant"
  description: A file tool named with no path is a whole-tool grant that OVERRIDES the working-directory check, so --add-dir beside it suppresses a prompt rather than building a jail; and a path rule spelled under any name but Read or Edit is never consulted, so it denies the access it appears to grant.
  entry: python -m ci_truth_serum.check_unscoped_tool_grant
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

# ───────────────────────── Tier 2 · Opinionated (opt-in) ─────────────────────
# These prescribe a specific architecture. Enable only if you follow it.
- id: check-always-reporter
  name: "opinionated: require an always() reporter on gated workflows"
  description: "Assumes the decide-job pattern. A gated workflow needs an always() reporter, or a fail-closed twin that names every gate and exits nonzero. Without one, a failed gate skips every work job and the merge greens over it."
  entry: python -m ci_truth_serum.check_always_reporter
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-required-reporter
  name: "opinionated: classify every always() reporter as required or advisory"
  description: "An unclassified always() reporter silently escapes the required-status-check set; mark it required-check true|false. A required-check true marker on a uses: job also fails, since GitHub reports that job under a name the marker cannot predict."
  entry: python -m ci_truth_serum.check_required_reporter
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-required-event-closure
  name: "opinionated: every job a required check needs must run on every event it gates"
  description: GitHub counts a skipped check run as a satisfied required check. A needed job that skips on a gating event turns the check green with no work done.
  entry: python -m ci_truth_serum.check_required_event_closure
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-inline-run-length
  name: "opinionated: enforce externalizing oversized inline run blocks"
  description: Long inline run shell is invisible to shellcheck/shfmt/shellharden.
  entry: python -m ci_truth_serum.check_inline_run_length
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-job-timeout
  name: "opinionated: require timeout-minutes on every job"
  description: A job without timeout-minutes inherits GitHub's 360-minute (6h) default, so one wedged step pins a runner slot for six hours and starves the pool.
  entry: python -m ci_truth_serum.check_job_timeout
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-uncached-download
  name: "opinionated: require a cache in any job that downloads a pinned tool"
  description: A job that installs a version-pinned tool with no cache re-downloads identical bytes on every run, and a slow registry turns that cost into a job timeout GitHub reports as "cancelled".
  entry: python -m ci_truth_serum.check_uncached_download
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-concurrency
  name: "opinionated: require explicit cancel-in-progress on concurrency groups"
  description: Missing cancel-in-progress silently defaults to false (queue-don't-cancel).
  entry: python -m ci_truth_serum.check_concurrency
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-static-concurrency
  name: "opinionated: no static workflow-level concurrency lock on required checks"
  description: A static concurrency group (no per-ref key) on a decide+always() workflow can hang the required check at "Expected — Waiting".
  entry: python -m ci_truth_serum.check_static_concurrency
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-pending-cancel-concurrency
  name: "opinionated: no ref-keyed concurrency group where PR types storm one SHA"
  description: With pull_request types beyond opened/synchronize/reopened, multiple runs queue on ONE head SHA; a per-ref/per-PR group then cancels a current-SHA sibling and its always() reporter reddens the required check with no real failure.
  entry: python -m ci_truth_serum.check_pending_cancel_concurrency
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-requires-concurrency
  name: "opinionated: require a concurrency block on pull_request workflows"
  description: A PR workflow with no concurrency block stacks a fresh run per push instead of cancelling the superseded one, starving a capped runner pool.
  entry: python -m ci_truth_serum.check_requires_concurrency
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-path-gate-deps
  name: "opinionated: require decide filters to cover every gated-job dependency"
  description: A decide filter omitting a gated job's composite/script dependency fails open exactly when that dependency changes.
  entry: python -m ci_truth_serum.check_path_gate_deps
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  # always_run: coverage can break from the DEPENDENCY side (a new file under
  # .github/actions/X/ or a declared gate-deps dir) with no workflow edit, so a
  # files:-filtered hook would never re-check. The scan is cheap (YAML + regex).
  always_run: true

- id: check-reusable-permissions
  name: "opinionated: a caller must grant every permission its reusable workflow needs"
  description: A permission added to a shared workflow, with no matching change in its callers, fails every calling run at start. The error names the callee, not the caller. Both sides are static YAML, so the check compares them.
  entry: python -m ci_truth_serum.check_reusable_permissions
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  # The requirement lives in the CALLEE, so a caller can break with no edit of
  # its own. That is still covered here: the callee is a workflow file too, and
  # the hook rescans every workflow whenever any one of them is staged.
  files: ^\.github/workflows/
  types: [yaml]

- id: check-failure-notifier-coverage
  name: "opinionated: keep the failure notifier's workflow_run list in sync with the tree"
  description: workflow_run has no wildcard, so the notifier's workflows list is a derived copy; a stale copy silently drops failure notifications. The notifier is discovered by shape (on.workflow_run plus a notification sink), whatever the file is called, and no discoverable notifier is a failure rather than a green nothing verified.
  entry: python -m ci_truth_serum.check_failure_notifier_coverage
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-failure-only-diagnostics
  name: "opinionated: a diagnostics step must also run when the job is cancelled"
  description: A job that passes its timeout-minutes ends "cancelled", not "failed". An artifact upload or a log-collection script gated on failure() alone is skipped on that run, and the evidence dies with the runner. The check asks the step, or the job that holds it, to name always() or cancelled(). It reads a run body on the bash grammar, so a script name inside a printed message is not a call.
  entry: python -m ci_truth_serum.check_failure_only_diagnostics
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-conclusion-coverage
  name: "opinionated: one terminal-red conclusion set, which no consumer may narrow"
  description: A completed run also ends `timed_out`, `startup_failure` or `action_required`, so a listener, router or scanner that recognizes only `failure` lets a real red reach nobody. The check reads workflow expressions, shell tests and Python comparisons through their own parsers, and names the conclusions each site left out. `cancelled` is never required, because a superseded run is not a failure. Widen the set for the whole repository in `.github/conclusion-coverage.yml`.
  entry: python -m ci_truth_serum.check_conclusion_coverage
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types_or: [shell, python, yaml]

- id: check-cancellable-required-check
  name: "opinionated: no static cancellable workflow-level concurrency lock on required checks"
  description: "A static cancellable concurrency group on a `# required-check: true` workflow lets a sibling ref cancel the run and its workflow-level always() reporter wholesale, hanging the check at 'Expected — Waiting'."
  entry: python -m ci_truth_serum.check_cancellable_required_check
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-externalized-markers
  name: "opinionated: flag policy markers reachable only through script/composite indirection"
  description: A history-rewrite (etc.) command in .github/scripts/*.sh is invisible to an inline-run guard, which then passes vacuously.
  entry: python -m ci_truth_serum.check_externalized_markers
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-token-fallback
  name: "opinionated: ban `secrets.A || secrets.B` fallbacks in token positions"
  description: The fallback silently switches push identity the day the first secret is set.
  entry: python -m ci_truth_serum.check_token_fallback
  language: python
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-workflow-secret-names
  name: "opinionated: round-trip referenced secrets/vars against .github/workflow-secrets.txt"
  description: A misspelled secret evaluates to empty and the workflow silently degrades; the allowlist makes every name a reviewed choice. Prints the corrected file on mismatch.
  entry: python -m ci_truth_serum.check_workflow_secret_names
  language: python
  pass_filenames: false
  files: ^\.github/(workflows|actions|workflow-secrets\.txt)
  types_or: [yaml, text]

- id: check-pin-comment-truth
  name: "opinionated: keep `# vX.Y` comments on SHA-pinned uses: present and consistent"
  description: The version comment is the only human-readable part of a SHA pin; the same SHA annotated `# v6` here and `# v7.0.0` there means at most one is true.
  entry: python -m ci_truth_serum.check_pin_comment_truth
  language: python
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-divergent-action-pins
  name: "opinionated: keep a SHA-pinned GitHub Action pinned to ONE SHA repo-wide"
  description: Two references to the same action at different SHAs are both validly pinned, so no per-reference audit sees it — a bump that updated some call sites and missed others.
  entry: python -m ci_truth_serum.check_divergent_action_pins
  language: python
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-stderr-merge-parse
  name: "opinionated: ban parsing a 2>&1-merged stream (stderr noise becomes data)"
  description: '`v=$(cmd 2>&1 | tail -1)` makes any stderr warning part of "the value"; diagnostic captures (`out=$(cmd 2>&1)` + echo) are never flagged.'
  entry: python -m ci_truth_serum.check_stderr_merge_parse
  language: python
  additional_dependencies: [PyYAML]
  types_or: [shell, yaml]

- id: check-echo-fallback
  name: "opinionated: ban `|| echo` fallbacks that convert a failure into a parseable string"
  description: '`$(cmd || echo "error")` hands the caller a benign-looking value where a failure happened.'
  entry: python -m ci_truth_serum.check_echo_fallback
  language: python
  types: [shell]

- id: check-bare-return-status
  name: "opinionated: require an explicit status on a `return` that `&&` or `||` guards"
  description: A bare `return` hands back the status of the last command that ran, so the operator decides the value. `A && return` is always 0, and `[[ … ]] || return` is always 1.
  entry: python -m ci_truth_serum.check_bare_return_status
  language: python
  types: [shell]

- id: check-lockstep-pins
  name: "opinionated: verify configured twin pins agree (the enforced 'keep in lockstep' comment)"
  description: Each --pair extracts one value from each of two files and fails unless they are equal; zero or multiple matches is a hard error. Config-driven, so it is NOT in the check-tier2 aggregate — enable it standalone with args.
  entry: python -m ci_truth_serum.check_lockstep_pins
  language: python
  pass_filenames: false
  always_run: true

- id: check-bare-mkdir
  name: "opinionated: a bare `mkdir -p` proves nothing about the directory"
  description: On macOS and BSD `mkdir -p "$X"` exits 0 when $X is an existing dangling symlink, so a caller that needs the directory afterward must test the post-condition instead of the exit status.
  entry: python -m ci_truth_serum.check_bare_mkdir
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-env-arith
  name: "opinionated: ban an environment-sourced variable inside $(( )) arithmetic"
  description: An unvalidated env var inside arithmetic is a syntax error that aborts a `set -e` caller, and some garbage values coerce to 0 and silently disable the limit. Validate the value into a variable first.
  entry: python -m ci_truth_serum.check_env_arith
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-curl-retry
  name: "opinionated: require a retry on a file-writing curl download"
  description: "A single-shot `curl -o file` fails the whole install for one dropped packet. Name your own retry helpers with `--retry-wrapper NAME`."
  entry: python -m ci_truth_serum.check_curl_retry
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-retry-loop
  name: "opinionated: ban a new hand-rolled attempt-and-sleep loop"
  description: "A counter-bound loop that sleeps between attempts re-decides the attempt count, the wait and the exhaustion message, and gets one of them wrong. Name the repo's primitive with `--retry-helper` and its wrappers with `--wrapper NAME`."
  entry: python -m ci_truth_serum.check_retry_loop
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-unbounded-waits
  name: "opinionated: bound a git remote call with a timeout"
  description: "A `git fetch`/`clone`/`push`/`pull`/`ls-remote` against a wedged endpoint hangs forever, which eats a Ctrl-C in an interactive hook and strands a teardown. Put the bound first: `timeout 60 git fetch`. Scope the check with `files:`."
  entry: python -m ci_truth_serum.check_unbounded_waits
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-shell-source-declarations
  name: "opinionated: every `source` shellcheck cannot follow must say why"
  description: "A `# shellcheck source=` comment naming a path the tree lacks, masked by a nearby `disable=SC1091`, makes shellcheck exit 0 having never read the library. Pass your shellcheck `-P` roots with `--search-path`."
  entry: python -m ci_truth_serum.check_shell_source_declarations
  language: python
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  types: [shell]

- id: check-sparse-checkout-closure
  name: "opinionated: a sparse-checkout list must cover what its job reads"
  description: A job that checks out sparsely and then runs a tracked file the list omits dies with "No such file or directory" on the runner, and no static read of the tree sees it coming — sparse-checkout sets SKIP_WORKTREE rather than removing the entry. The closure follows a served Python entrypoint's local imports too. A file in the closure declares what it opens at run time with a sparse-checkout-needs comment.
  entry: python -m ci_truth_serum.check_sparse_checkout_closure
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

# ───────────────────────── Extras · Unrelated bonus checks ───────────────────
# Useful, but unrelated to CI truth. Opt-in.
- id: check-absolute-symlinks
  name: "extra: reject tracked symlinks a fresh clone cannot follow"
  description: A symlink to an absolute path, or to a path git ignores, dangles on every machine but the author's. The id is not check-symlinks, which pre-commit-hooks uses for a different rule.
  entry: ci_truth_serum/check_absolute_symlinks.sh
  language: script
  pass_filenames: false

- id: check-unnamed-regex-groups
  name: "extra: require named groups in Python re.* literals"
  description: Unnamed capture groups make match handling positional and brittle.
  entry: python -m ci_truth_serum.check_unnamed_regex_groups
  language: python
  types: [python]

- id: check-replacement-expansion
  name: "extra: ban an assembled string as a replace() replacement"
  description: replace() and re.sub() re-parse the replacement for substitution patterns, so a built string that holds $& or \g<0> rewrites the output; pass a function replacer.
  entry: python -m ci_truth_serum.check_replacement_expansion
  language: python
  types_or: [javascript, jsx, ts, tsx, python]
  # The grammar bindings answer "is this argument the replacement, and does this
  # template interpolate?" — questions about the tree, not about the text.
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]

- id: check-unpaged-all
  name: "extra: ban an all-shaped verdict over one unpaged GitHub listing"
  description: One page of a listing holds 100 rows, so `all(...)`/`.every(...)` over it reads a longer listing as a pass; page to `total_count`.
  entry: python -m ci_truth_serum.check_unpaged_all
  language: python
  types_or: [javascript, jsx, ts, tsx, python]
  # The grammars answer "is this key a read, or characters inside a string?" —
  # a question about the tree, not about the text.
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]

- id: check-global-stdio-swap
  name: "extra: ban reassigning sys.stdin/stdout/stderr in source Python"
  description: Swapping process-global streams is not thread-safe under concurrency.
  entry: python -m ci_truth_serum.check_global_stdio_swap
  language: python
  types: [python]

- id: check-claude-model
  name: "extra: require an explicit model on claude-code-action steps"
  description: A claude-code-action step without --model silently runs on the action's default (Opus) tier.
  entry: python -m ci_truth_serum.check_claude_model
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-drift-guards
  name: "extra: require a justification on drift-guard (copies-agree) tests"
  description: A test asserting two copies agree hides a missing SSOT; mark it @pytest.mark.drift_guard("<why>") so the reason is reviewed.
  entry: python -m ci_truth_serum.check_drift_guards
  language: python
  # PyYAML for the shared _cts_linecheck import; the grammar bindings because
  # comments are located by each language's own parser rather than by delimiter
  # (a `#` in a heredoc body, a `//` inside a JS string, are not narration).
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  # Python tests use @pytest.mark.drift_guard; JS/TS/shell suites carry copies-agree
  # tests too, caught by a phrase pass and excused with `drift-guard-ok: <reason>`.
  types_or: [python, javascript, ts, shell]

- id: check-graceful-handwave
  name: "extra: ban graceful-degradation hand-waves in prose and comments"
  description: The word claims a guarantee while specifying nothing; state the concrete behaviour or annotate allow-graceful.
  entry: python -m ci_truth_serum.check_graceful_handwave
  language: python
  # Comments are located by each language's own grammar (see `_cts_comments`).
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  types_or: [shell, python, javascript, ts, markdown, rst]

- id: check-historical-comments
  name: "extra: ban historical narration in code comments"
  description: A comment narrating how the code changed is unverifiable and rots; describe the current code, or annotate allow-history.
  entry: python -m ci_truth_serum.check_historical_comments
  language: python
  # Comments are located by each language's own grammar (see `_cts_comments`).
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  types_or: [shell, python, javascript, ts]

- id: check-doc-line-refs
  name: "extra: ban exact line-number citations in Markdown docs"
  description: A doc citing source by line number rots the moment code moves; cite a symbol/section instead.
  entry: python -m ci_truth_serum.check_doc_line_refs
  language: python
  types: [markdown]

- id: check-workflow-refs
  name: "extra: ban a doc/comment citing a workflow file that does not exist"
  description: A renamed or consolidated workflow leaves every sentence naming the old file pointing at nothing; the citation is a bare basename, so no link checker catches it.
  entry: python -m ci_truth_serum.check_workflow_refs
  language: python
  # Comments are located by each language's own grammar (see `_cts_comments`).
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  types_or: [shell, python, javascript, ts, markdown, rst, yaml]

- id: check-flag-arity
  name: "extra: require an arity guard on value-taking CLI flag arms"
  description: A `--flag) x=$2; shift 2` arm relying only on the loop's `$# -gt 0` dies with a raw unbound-variable error when the flag is passed last; guard `$2` before reading it.
  entry: python -m ci_truth_serum.check_flag_arity
  language: python
  additional_dependencies: [tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-secret-file-perms
  name: "extra: flag a secret file created world-readable then chmod'd private after"
  description: A credential file created with the default umask and only tightened to 0600 on a later line is world-readable in the window between; create it private from the start.
  entry: python -m ci_truth_serum.check_secret_file_perms
  language: python
  types: [shell]

- id: check-test-predicate-shadow
  name: "extra: ban a test redefining a production pure predicate"
  description: Stubbing a dependency is fine; redefining a side-effect-free predicate substitutes the test's own (usually weaker) copy of the logic, so a regression in the shipped one cannot fail the test.
  entry: python -m ci_truth_serum.check_test_predicate_shadow
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  # A violation is a PAIR (a test-side definition, a production-side predicate),
  # so the passed file list can only narrow the scan: the production side always
  # self-discovers via `git ls-files`, and a passed production file widens the
  # test side to the whole tree — that commit can create the pair from the side
  # pre-commit is not passing.
  types: [shell]

- id: check-stray-tool-markup
  name: "extra: ban stray agent tool-call markup committed into a file"
  description: A leaked closing/opening tool-call tag (</invoke>, <parameter …>, </content>) on its own line renders as literal garbage; only whole-line bare tags are flagged, fenced examples are skipped.
  entry: python -m ci_truth_serum.check_stray_tool_markup
  language: python
  types_or: [shell, python, javascript, ts, markdown, rst]

- id: check-case-default
  name: "extra: require a bare `*)` default arm on every shell case block"
  description: A case with no default silently no-ops on an unexpected value and leaves its variables unset.
  entry: python -m ci_truth_serum.check_case_default
  language: python
  types: [shell]

- id: check-cron-comment
  name: "extra: fail a schedule comment that contradicts its cron expression"
  description: '"# daily" above a weekly cron misleads every reviewer; ambiguous shapes always pass.'
  entry: python -m ci_truth_serum.check_cron_comment
  language: python
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

- id: check-cron-alert-coverage
  name: "extra: a scheduled workflow's failures must reach a human"
  description: A cron has no PR surface, so its red is visible only in the Actions tab; a notifier behind a success-only gate reads as coverage and fires never. Fails closed — a repo that routes its crons nowhere passes --allow-unrouted.
  entry: python -m ci_truth_serum.check_cron_alert_coverage
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-external-clock-targets
  name: "extra: every external-clock dispatch-manifest entry must name a fireable workflow"
  description: A host outside GitHub can fire a repository's sweeps on a clock it owns. The clock reads a manifest of workflow file names and dispatches each. An entry that names a missing workflow, a workflow with no workflow_dispatch trigger, or one with a required default-less input drops every tick with no red mark. Default manifest .github/scheduler/sweeps.txt; override with --manifest PATH.
  entry: python -m ci_truth_serum.check_external_clock_targets
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  # The manifest names workflows, and a workflow can lose its `workflow_dispatch`
  # trigger with no edit to the manifest, so the check rescans on any workflow or
  # manifest change. Reads both .github/workflows and the scheduler manifest.
  files: ^\.github/(workflows/|scheduler/)
  types_or: [yaml, text]

- id: check-unused-reusable-input
  name: "extra: a reusable workflow's input must have a caller that passes it"
  description: An input no local job passes is either dead surface or the shared answer nobody wired, and the second grows a duplicate implementation beside it. A reusable workflow that no local job calls is skipped, because its callers may live in another repository.
  entry: python -m ci_truth_serum.check_unused_reusable_input
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  # The `with:` block that uses an input lives in the CALLER, so an input can
  # fall out of use with no edit to the file declaring it. The hook rescans every
  # workflow whenever any one of them is staged.
  files: ^\.github/workflows/
  types: [yaml]

- id: check-multi-cron-gating
  name: "extra: every job in a multi-cron workflow must name its cron"
  description: GitHub starts every schedule-eligible job on EVERY cron fire, so in a file with two or more crons a job gated on the bare `github.event_name == 'schedule'` (or on nothing) runs for all of them — the observed cost was a paid eval on a schedule nobody asked for, billed silently. Single-cron workflows are exempt.
  entry: python -m ci_truth_serum.check_multi_cron_gating
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-workflow-run-branch-filter
  name: "extra: a workflow_run listener must filter the branches it answers"
  description: A listener with no branch filter gets a run created for every completion of every watched workflow, on every branch, because its own gate runs after run creation. About 3,000 such no-op runs stalled `merge_group` check dispatch for 7 hours, and every one of them reported success. A filter that narrows nothing (an all-wildcard list, an empty list) is the same finding. Opt out with a reasoned `# unfiltered-listener-ok` marker.
  entry: python -m ci_truth_serum.check_workflow_run_branch_filter
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/workflows/
  types: [yaml]

- id: check-toolchain-skips
  name: "extra: pytest skips gated on binary discovery must fail (not skip) in CI"
  description: A which()-gated skipif silently zeroes the guarded coverage on a runner missing the tool; demand a CI env guard in the condition.
  entry: python -m ci_truth_serum.check_toolchain_skips
  language: python
  types: [python]

- id: check-env-symmetry
  name: "extra: enforce write/read symmetry for prefixed env vars"
  description: A prefixed env var written but never read (or read but never written) is a half-finished rename that silently reads unset; requires --prefix and scans the whole tracked tree.
  entry: python -m ci_truth_serum.check_env_symmetry
  language: python
  # Whole-tree scan (a write and its read live in different files) — self-
  # discovers via `git ls-files`, so the passed file list is ignored. Supply the
  # project prefix: `args: [--prefix, GLOVEBOX_]`.
  pass_filenames: false

- id: check-dead-shell-functions
  name: "extra: flag a shell function nothing outside tests calls"
  description: A function no production code calls rots — its assumptions drift from the live code, and it tells a reader a code path exists. References are swept across the whole tracked tree, so a caller in a workflow or a Python shell-out still counts.
  entry: python -m ci_truth_serum.check_dead_shell_functions
  language: python
  additional_dependencies: [PyYAML, tree-sitter, tree-sitter-bash]
  types: [shell]

- id: check-cwd-scoped-git
  name: "extra: a git argv built in Python must name its repository"
  description: '`subprocess.run(["git", "merge", "--abort"])` with no `-C` and no `cwd=` acts on whatever directory the process sits in — a test driving that helper in-process aborts the developer''s own merge.'
  entry: python -m ci_truth_serum.check_cwd_scoped_git
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-unspecified-encoding
  name: "extra: name the encoding on every text-mode filesystem call"
  description: "`read_text()` and `open()` with no `encoding=` decode with the platform default, so a file holding an em-dash mis-decodes on one host and nowhere else."
  entry: python -m ci_truth_serum.check_unspecified_encoding
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-duplicate-module-constant
  name: "extra: ban a module-level name assigned twice at top level"
  description: The second binding silently shadows the first, so an edit to the first is discarded with no error.
  entry: python -m ci_truth_serum.check_duplicate_module_constant
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-duplicate-class-names
  name: "extra: ban one top-level class name defined in two modules"
  description: "Two modules defining the same class name means neither is the definition, and a call site reads one header while getting the other's behaviour. Narrow the comparison set with `--scope DIR`."
  entry: python -m ci_truth_serum.check_duplicate_class_names
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-big-tuple-annotations
  name: "extra: ban a positional tuple annotation of three or more elements"
  description: "A fixed-length heterogeneous tuple forces every call site to remember what position means what, and a reordered pair is a silent bug. Use a NamedTuple. Threshold: `--min-elements`."
  entry: python -m ci_truth_serum.check_big_tuple_annotations
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-unreset-module-state
  name: "extra: a module that mutates module-level state must declare a reset"
  description: "pytest-xdist runs many tests in one long-lived worker that imports the module once, so one test's write is the next test's answer. Name your reset convention with `--reset-name`."
  entry: python -m ci_truth_serum.check_unreset_module_state
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-sleep-as-sync
  name: "extra: ban a fixed sleep used to synchronise before an assertion"
  description: The sleep bets that the event lands inside N seconds; the scheduler settles the bet, so it loses on a loaded shard and hides a never-arriving event on a quiet one. Poll the condition with a deadline.
  entry: python -m ci_truth_serum.check_sleep_as_sync
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-positional-git-argv
  name: "extra: ban a test that models git's argv positionally"
  description: "`git -c protocol.version=2 fetch` shifts `fetch` to $3, so an anchored assertion goes red and a `$1`-keyed stub goes silent — it stops intercepting and the test passes asserting nothing. Search the argv for the subcommand instead."
  entry: python -m ci_truth_serum.check_positional_git_argv
  language: python
  additional_dependencies:
    [
      PyYAML,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
  types: [python]

- id: check-test-helper-kwargs
  name: "extra: a test call must pass keywords its helper accepts"
  description: "Nothing type-checks a test's call sites, so a renamed keyword-only parameter and a new call site using the old spelling merge clean and go red as `TypeError`. Name your helper packages with `--helper-package`."
  entry: python -m ci_truth_serum.check_test_helper_kwargs
  language: python
  additional_dependencies: [PyYAML]
  types: [python]

- id: check-wall-clock-assertions
  name: "extra: ban an assertion on a measured wall-clock duration"
  description: A shared runner gives a test no promise about when it runs, so an assertion on elapsed time measures the machine's load and flakes in both directions. Assert the bound's observable instead, or record what a stubbed sleep was asked for.
  entry: python -m ci_truth_serum.check_wall_clock_assertions
  language: python
  additional_dependencies:
    [PyYAML, tree-sitter, tree-sitter-javascript, tree-sitter-typescript]
  types_or: [javascript, jsx, ts, tsx, python]

- id: check-relative-imports
  name: "extra: a relative import specifier must resolve to a real file"
  description: "Node's ESM resolver does no extension guessing and no directory-index fallback, so `./lib-hook-io` for `lib-hook-io.mjs` is ERR_MODULE_NOT_FOUND and a directory target is ERR_UNSUPPORTED_DIR_IMPORT."
  entry: python -m ci_truth_serum.check_relative_imports
  language: python
  additional_dependencies:
    [PyYAML, tree-sitter, tree-sitter-javascript, tree-sitter-typescript]
  types_or: [javascript, jsx, ts, tsx]

- id: check-path-shadowed-interpreter
  name: "extra: no step after an agent step may reach Python by bare name"
  description: "`claude-code-action` writes /usr/bin to $GITHUB_PATH, and the runner rebuilds PATH by prepending each line, so every later step resolves a bare `python3` to the system interpreter and dies on a package `uv sync` installed. Name the interpreter by path."
  entry: python -m ci_truth_serum.check_path_shadowed_interpreter
  language: python
  additional_dependencies: [PyYAML]
  pass_filenames: false
  files: ^\.github/(workflows|actions)/
  types: [yaml]

# ───────────────────────── Aggregates · enable a whole tier ──────────────────
# One id runs every Python check in the tier; new checks added to the tier are
# picked up with no consumer change. Three checks are not aggregated — enable
# each on its own: `check-absolute-symlinks` (a language:script shell hook),
# `check-lockstep-pins` (config-driven; it hard-errors without the per-repo
# --pair args an aggregate cannot supply), and `check-env-symmetry` (needs a
# per-project --prefix arg an aggregate can't supply). These have no files/types
# filter so they always run (the workflow lints self-discover); the content
# lints inside still receive only files of their kind.
- id: check-tier1
  name: "aggregate: every Tier 1 (honesty + identity) check"
  description: Runs the default-on honesty + identity lints under one id.
  entry: python -m ci_truth_serum.run_tier 1
  language: python
  additional_dependencies:
    [
      PyYAML,
      identify,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]

- id: check-tier2
  name: "aggregate: every Tier 2 (opinionated) check"
  description: Runs the opinionated required-check-shape lints under one id; assumes that architecture.
  entry: python -m ci_truth_serum.run_tier 2
  language: python
  additional_dependencies:
    [
      PyYAML,
      identify,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]

- id: check-extras
  name: "aggregate: every Extras (off-theme bonus) Python check"
  description: Runs the Python extras under one id (check-absolute-symlinks, a shell hook, is enabled separately).
  entry: python -m ci_truth_serum.run_tier extras
  language: python
  additional_dependencies:
    [
      PyYAML,
      identify,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]

# Select by TAG (what a check is about) instead of by tier (how opinionated it
# is). Needs at least one `--select`; a typo or an empty selection exits 2
# rather than running a smaller set. Carries every member's dependency, because
# a selection can name any check in the pack.
- id: check-select
  name: "aggregate: every check a --select expression names (tier / tag / check)"
  description: "Runs the checks the args select: all | tier:<1|2|extras> | tag:<name> | check:<id>, minus any --ignore."
  entry: python -m ci_truth_serum.run_selection
  language: python
  additional_dependencies:
    [
      PyYAML,
      identify,
      tree-sitter,
      tree-sitter-bash,
      tree-sitter-javascript,
      tree-sitter-typescript,
    ]
