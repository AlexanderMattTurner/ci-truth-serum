[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-truth-serum"
# Computed from package.json — the one file the release pipeline bumps — by
# ci_truth_serum._version; see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Fast, offline pre-commit lints that make a CI pipeline confess what it's hiding."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pre-commit", "ci", "github-actions", "linter", "supply-chain"]
# PINNED EXACTLY, not floored. This package is a lint pack: it is installed into
# a pre-commit venv or a CI job of its own, never resolved alongside an
# application's dependency graph, so there is no consumer for a range to serve.
# A floor let every consumer install whatever the index served that day, which
# put unreviewed bytes of a tree-sitter grammar into the job that runs the hooks.
# Bump these with `uv lock` in the same commit, so the tested versions and the
# published ones are the same versions.
dependencies = [
    "PyYAML==6.0.3",
    "identify==2.6.19",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.urls]
Homepage = "https://github.com/AlexanderMattTurner/ci-truth-serum"

[project.scripts]
# Apply half of check-required-reporter: rewrite a repo's branch-protection
# ruleset to the required checks the workflow annotations declare.
sync-required-checks = "ci_truth_serum.sync_required_checks:main"
# Repair half of a merge queue that stops merging: hold the grouping and the
# group sizes at values that can merge, and report the states only a human can
# fix. Not a pre-commit lint and not in any tier aggregate.
sync-merge-queue = "ci_truth_serum.sync_merge_queue:main"
# Release verifier: assert the max published npm version, the max v* git tag,
# and the changelog's top dated heading all agree (its `npm view` call is the
# only network touch). Not a pre-commit lint and not in any tier aggregate.
release-canary = "ci_truth_serum.release_canary:main"
# Run-history sensor: name the workflows whose runs failed before any job
# started, the one failure shape no static read of the tree can find. Not a
# pre-commit lint and not in any tier aggregate.
startup-failure-scan = "ci_truth_serum.startup_failure_scan:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist", "ruff", "hypothesis>=6"]
# Mutation testing is heavy and pulls its own deps; keep it out of the default
# `dev` install so the fast test/lint path stays lean. CI's scheduled mutation
# job installs `--extra mutation` explicitly. cosmic-ray (not mutmut) because the
# test harness loads each hook by FILE PATH (tests/_helpers.load_hook), not via
# `import ci_truth_serum.x` — mutmut 3.x instruments through an import trampoline that
# file-path loading bypasses, so its mutants are never reached. cosmic-ray mutates
# the file on disk and reruns the suite, so it is agnostic to how tests import.
mutation = ["pytest>=7", "pytest-xdist", "hypothesis>=6", "cosmic-ray>=8"]

[tool.setuptools.dynamic]
# The value is computed, not a literal, so setuptools imports this module at
# build time instead of reading it statically. package.json ships in the sdist
# (MANIFEST.in), so a build from an unpacked sdist resolves it too.
version = { attr = "ci_truth_serum._version.__version__" }

[tool.setuptools]
# The lints are importable/runnable as `ci_truth_serum.check_*`; pre-commit invokes them
# as `python -m ci_truth_serum.check_foo` from the installed package.
packages = ["ci_truth_serum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "drift_guard(reason): acknowledged copies-agree test whose true SSOT is infeasible (see check-drift-guards)",
]

[tool.ruff]
target-version = "py310"
# Govern only this package's own code; the inherited automation harness
# (.claude/, config/) is out of scope for ci-truth-serum's lint gate.
extend-exclude = [".venv", "node_modules", ".claude", "config"]

[tool.ruff.lint]
extend-select = ["I"]
