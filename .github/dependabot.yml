version: 2

# Only track a handful of npm packages for version updates.
# Security updates for all packages are handled separately by
# GitHub's Dependabot security alerts (enabled at the repo level).
#
# "Watch everything" generates weekly churn that maintainers tend to
# rubber-stamp, undermining the security goal. Default to security-only
# monitoring with explicit opt-in for packages you actively care about.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # The CI-only Python tooling pinned in .github/requirements-ci.txt. Without this
  # entry those pins have no bumper at all: Dependabot reads requirements files but
  # not versions written inline in a workflow `run:` line.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "monthly"
    groups:
      ci-tooling:
        patterns:
          - "*"
    cooldown:
      default-days: 7
