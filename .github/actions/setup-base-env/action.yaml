name: "Setup Base Environment"
description: "Sets up Node.js with pnpm and caching when a package.json is present (no-op otherwise). Optionally sets up Python with uv."
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  setup-python:
    description: >-
      Whether to set up uv and the interpreter named by .python-version, then
      `uv sync --frozen`.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Get pnpm store directory
      if: hashFiles('package.json') != ''
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Restore pnpm cache
      if: hashFiles('package.json') != ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Node Dependencies
      if: hashFiles('package.json') != ''
      # `--frozen-lockfile` enforces lockfile integrity, but only a repo that
      # commits a `pnpm-lock.yaml` has one to freeze; a lockfile-less repo (this
      # one — package.json exists only for prettier/commitlint) would else hit
      # ERR_PNPM_NO_LOCKFILE. Freeze when a lockfile is present, plain otherwise.
      run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '' }}
      shell: bash

    - name: Set up uv and Python
      if: inputs.setup-python == 'true'
      uses: ./.github/actions/setup-uv
      with:
        install-python: "true"

    - name: Install Python Dependencies
      if: inputs.setup-python == 'true'
      run: uv sync --frozen
      shell: bash
