name: "Setup Base Environment"
description: "Sets up Node.js with pnpm and caching when a package.json is present (no-op otherwise). Optionally sets up Python with uv."
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  registry-url:
    description: "npm registry URL to configure (for publishing; lets setup-node wire up OIDC/auth)"
    required: false
    default: ""
  setup-python:
    description: "Whether to set up Python with uv"
    required: false
    default: "false"
  python-version:
    description: "Python version to use (if setup-python is true)"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Get pnpm store directory
      if: hashFiles('package.json') != ''
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Restore pnpm cache
      if: hashFiles('package.json') != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Node Dependencies
      if: hashFiles('package.json') != ''
      run: pnpm install
      shell: bash

    - name: Set up uv
      if: inputs.setup-python == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      if: inputs.setup-python == 'true'
      run: uv python install "$PYTHON_VERSION"
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}

    - name: Install Python Dependencies
      if: inputs.setup-python == 'true'
      run: uv sync --frozen
      shell: bash
