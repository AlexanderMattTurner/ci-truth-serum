name: CI failure notify

# Push a phone notification (via ntfy) whenever a workflow fails outside a pull
# request. A push-to-main or scheduled run has no PR in front of you, so its red
# lands in an Actions tab nobody opens and rots unseen. PR-triggered failures are
# excluded: they are already visible on the PR.
#
# `workflow_run` has no wildcard, so `workflows:` must name every push/schedule
# workflow in THIS repo by its `name:`. That makes the list a derived copy of the
# tree, and check-failure-notifier-coverage is its freshness check: a workflow
# missing from the list fails silently forever. Regenerate the block from that
# hook's output rather than editing it by hand.
#
# The notification does nothing unless the GH_NTFY_SUBJECT secret is set, and a
# repo that has not opted in never goes red for it. That run does carry a
# `::warning::` annotation which says the failure notified nobody, because a
# green notifier run is otherwise no evidence that an alert arrived. Set
# GH_NTFY_URL to target a self-hosted ntfy server (defaults to https://ntfy.sh).
#
# The dangerous-triggers finding targets workflows that check out or execute the
# triggering ref's code with write credentials; this one checks out only its own
# default-branch action dir, credential-less, and never runs repo code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    types: [completed]
    workflows:
      - "CI"
      - "Format check"
      - "Gitleaks Secret Scanning"
      - "Hook lifecycle"
      - "Lint"
      - "Mutation testing"
      - "Node tests"
      - "Release readiness check"
      - "Sync from Template"
      - "Sync required status checks"
      - "Tag release (post-merge)"
      - "Validate config"
      - "pre-commit"
      - "zizmor"

concurrency:
  # Keyed per triggering workflow so notifications never queue behind each other;
  # never cancel — a dropped alert defeats the point.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify on workflow failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run workflows always execute from the default branch, so this
      # fetches exactly the vetted action; sparse + credential-less keeps it
      # to the notifier and nothing else.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/actions/notify-ntfy
          persist-credentials: false

      - name: Grade the alert
        id: severity
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          # Severity is graded, not uniform: an owner who gets every red at
          # ntfy's max priority learns to swipe all of them away, which costs
          # exactly the alert that mattered. The release pipeline earns priority
          # 5 because a break there stops releases shipping and nothing else
          # surfaces it; every other push/schedule failure is a next-working-day
          # fix, so it arrives at 3 (ntfy's default, no bypass-DND, no repeat).
          case "$WORKFLOW_NAME" in
            "Tag release"* | "Release "*)
              priority=5
              tags=rotating_light,rocket
              ;;
            *)
              priority=3
              tags=warning
              ;;
          esac
          {
            echo "priority=$priority"
            echo "tags=$tags"
          } >>"$GITHUB_OUTPUT"

      - name: Notify ntfy
        uses: ./.github/actions/notify-ntfy
        with:
          topic: ${{ secrets.GH_NTFY_SUBJECT }}
          base-url: ${{ secrets.GH_NTFY_URL }}
          priority: ${{ steps.severity.outputs.priority }}
          tags: ${{ steps.severity.outputs.tags }}
          title: "${{ github.repository }}: ${{ github.event.workflow_run.name }} failed"
          message: >-
            ${{ github.event.workflow_run.name }} failed on
            ${{ github.event.workflow_run.head_branch }}
            (${{ github.event.workflow_run.event }}, run #${{ github.event.workflow_run.run_number }}).
          click: ${{ github.event.workflow_run.html_url }}
