name: Dependabot Auto-Merge

# Enables auto-merge on every Dependabot PR, a major version bump included.
# Auto-merge only sets a flag: GitHub holds the merge until every required
# check passes, so a bump that breaks the build stays open.

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate on the PR author from the event payload. We deliberately do NOT add
    # a `github.actor == 'dependabot[bot]'` clause to also pin the pusher: the
    # zizmor `bot-conditions` audit flags github.actor as a spoofable actor
    # context (a HIGH finding). A collaborator pushing onto a dependabot branch
    # is already contained by branch protection — auto-merge only sets the flag,
    # so the pushed commit must still pass every required check before it merges.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
