name: Review-findings merge gate

# The merge queue's leg of the review-findings gate. The queue evaluates the
# required-check set on its own ephemeral sha, so the same predicate
# (review-findings-gate.sh — see review-findings-gate.yaml for the full model)
# must report there too; this job's own result is that report.
#
# This is a separate file from review-findings-gate.yaml ON PURPOSE, and it must
# NEVER gain a PR-event trigger: the required check's job sitting in a workflow
# that also fires on PR events would be reported `skipped` on every PR-event run,
# and GitHub counts a `skipped` check run as satisfying a required check — so a
# stray PR event (any label, any review comment) would overwrite a red gate on
# the head with a passing skipped instance. merge_group-only triggers are what
# make that impossible.
#
# This job is also where the required-check CONTEXT NAME lives: sync-required-checks
# reads the `# required-check: true` marker below and registers this job's `name:`
# in the ruleset, and review-findings-gate.sh posts its PR-head commit statuses
# under that same context. This repository has no merge queue enabled, so the job
# itself does not fire today and the PR-head post is the only reporting surface;
# the leg is correct the moment a queue is turned on.

on:
  merge_group:

permissions: {}

jobs:
  merge_gate:
    name: Review findings resolved # required-check: true
    # The job name is the required-check context sync-required-checks registers,
    # and review-findings-gate.sh posts its PR-head statuses under the SAME
    # name — one context, two reporting surfaces (queue sha here, PR head sha
    # from review-findings-gate.yaml's evaluate job and the resolver step).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # sparse-checkout the trusted gate script
      pull-requests: read # read the PR's reviews and threads
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the trusted gate script (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # review-findings-gate.sh sources the shared reviewer-identity, review
          # and thread libraries under .github/scripts/lib, and reads the
          # severity SSOT. Omit one and the script dies at its `source` line, or
          # at the `jq` that reads the severities, under `set -e`.
          sparse-checkout: |
            .github/scripts
            config/review-severities.json
          sparse-checkout-cone-mode: false
      - name: Evaluate the gate for every PR in the queued batch
        env:
          # The ref names only the LAST PR of a batch, so merge-group-prs.sh
          # derives the rest from the batch's own commits. Evaluating only the
          # named one lets every other PR in a multi-entry batch reach the
          # default branch with no verdict.
          MG_REF: ${{ github.event.merge_group.head_ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          prs="$(bash .github/scripts/merge-group-prs.sh)"
          [[ -n "$prs" ]] || { echo "no PR in the queued batch" >&2; exit 1; }
          while IFS= read -r pr; do
            # `</dev/null` keeps gh off the loop's stdin, the PR list it would
            # otherwise consume.
            PR="$pr" bash .github/scripts/review-findings-gate.sh </dev/null
          done <<<"$prs"
