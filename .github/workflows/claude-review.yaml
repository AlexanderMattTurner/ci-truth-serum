name: Claude reviewers

# Umbrella for the three automated PR reviewers, which share one file to cut the
# per-PR workflow fan-out on a shared, capped runner pool. They are not alike in
# where their code lives:
#
#   * `review` — the first-pass reviewer. It holds NO review logic. It is a call
#     into AlexanderMattTurner/agent-review, pinned to a commit, and what it
#     carries here is the `permissions:` CEILING that call is narrowed from, the
#     `if:` that decides which PRs are worth a read, and the inputs and secrets
#     the reviewer runs with. The base-only checkout, the sanitized input, the
#     per-job least privilege and the concurrency group all live in that
#     workflow's own file.
#   * `merge_delta_review` — the Sonnet merge-delta reviewer, and
#   * `thread_resolve` — the Haiku review-thread resolver.
#
# Those two stay self-contained here: each carries its own SECURITY header,
# `permissions:`, base-only checkout posture, `if:` guard and concurrency group,
# declared PER JOB and never workflow-level, so the jobs never cancel one
# another. All three run on the shared pull_request_target trigger, and each
# job's `if:` re-scopes it to its own events.
#
# The merge-conflict auto-resolver stays a SEPARATE file
# (auto-resolve-conflicts.yaml): it checks out the PR HEAD to merge into it, and
# co-locating a head checkout with pull_request_target trips CodeQL's
# untrusted-checkout query (file-scoped, blind to per-job event gating) and would
# blind that query to these secrets-bearing reviewer jobs. The scheduled
# reviewer-hold sweeper (claude-reviewer-hold-clear.yaml) is likewise separate.

on: # zizmor: ignore[dangerous-triggers] — reviewer jobs are base-only checkout + least privilege; see each job's header
  # Union of the three source triggers. `opened`/`ready_for_review`/`synchronize`
  # drive the first-pass reviewer and the merge-delta reviewer; `synchronize`
  # also drives the thread resolver. Each job's `if:` re-scopes it to its own
  # events. Because pull_request_target always runs the workflow file from the
  # base branch, these reviewers only take effect once merged to the default
  # branch.
  pull_request_target: # not-required-check
    types: [opened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Claude PR review (first pass) — the `review` job
  #
  # The reviewer itself now lives in AlexanderMattTurner/agent-review as a
  # reusable workflow, and this job only CALLS it. That repository holds the
  # whole reviewer: the one-read-per-PR budget, the per-file split for a diff
  # that outgrows one model context, the input sanitizer, the credential ladder
  # and the posting path. Its scripts run from the commit the `uses:` line pins,
  # cloned from a repository a pull request here cannot write, so the tree under
  # review can no longer rewrite the code that reviews it.
  #
  # One piece stays HERE, because the reviewer takes it as an input: the review
  # prompt (.github/prompts/claude-pr-review.md), which adds this repository's
  # own conventions to the reviewer's generic instructions.
  #
  # SECURITY — the called workflow's own header states the posture in full: a
  # base-only checkout, the PR's changes read only as sanitized DATA, and least
  # privilege per job. The `permissions:` block below is the CEILING those jobs
  # are narrowed from, never a grant — GitHub lets a called workflow request only
  # what the calling job holds, so a caller that grants less ends the run in
  # `startup_failure` before any job starts.
  #
  # The `if:` is a cheap payload-only pre-filter, so no runner boots for a draft,
  # a bot or a chore PR. It is NOT the authority: lib/review-skip-set.bash is,
  # and review-findings-gate.sh waives its wait for exactly that set while
  # auto-approve-skipped's script re-checks it before approving. A drift here
  # therefore costs one skipped job and never a wrong verdict. The set:
  #   - draft PRs and bot-authored PRs (dependabot et al. are handled by
  #     dependabot-auto-merge.yaml);
  #   - low-risk Conventional-Commit types by title — chore/style (matched as
  #     `type:` or `type(scope)`) — and machine-cut release PRs (title
  #     `release:`/`release(...)`), which carry no new human-authored code to
  #     read. We deliberately DO review ci/build/test, every code type
  #     (feat/fix/refactor/perf) and docs: a docs PR can restate a security
  #     boundary wrong, which is exactly the drift a second read catches. A PR
  #     whose title is not a recognized skip-type is reviewed.
  # The called workflow's own decide job then spends the one-read-per-PR budget,
  # reviewing on `opened` and re-arming on a `ready_for_review` or `synchronize`
  # that still owes a read.
  # ────────────────────────────────────────────────────────────────────────────
  review:
    # The skip set below, OR the on-demand label the skip notice offers. The
    # reviewer's own decide script answers a `labeled` event only for that
    # label, so every other label edit costs one skipped job.
    if: >-
      github.event.label.name == 'needs-auto-review' ||
      (
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.event.pull_request.title, 'chore:') &&
      !startsWith(github.event.pull_request.title, 'chore(') &&
      !startsWith(github.event.pull_request.title, 'style:') &&
      !startsWith(github.event.pull_request.title, 'style(') &&
      !startsWith(github.event.pull_request.title, 'release:') &&
      !startsWith(github.event.pull_request.title, 'release(')
      )
    permissions:
      contents: read # the reviewer checks out this repository's default branch
      pull-requests: write # post the review
      statuses: write # a caller's post-review command re-posts the head's verdict
      actions: read # the owed-review re-check lists this workflow's in-flight runs
      checks: read # the reviewer's jobs may read another check run on the head
    uses: AlexanderMattTurner/agent-review/.github/workflows/review.yaml@8fd4317a10020e28b8e721a11a2c9857b0027fc3 # pin-comment-ok: agent-review cuts no release yet; re-pin at its first vX.Y
    with:
      reviewer-repository: AlexanderMattTurner/agent-review
      # Name the pin again here. The called workflow falls back to
      # `github.job_workflow_sha`, which GitHub leaves EMPTY on a cross-repository
      # reusable call, and its clone step then refuses to run unpinned code. The
      # sha below MUST equal the one the `uses:` line above names; move both in
      # the same edit.
      reviewer-ref: 8fd4317a10020e28b8e721a11a2c9857b0027fc3
      review-prompt: .github/prompts/claude-pr-review.md
      # The review posts with the workflow GITHUB_TOKEN, and that token's events
      # start no workflow run. So `Review findings resolved` would sit at its old
      # verdict until the next push, the `recheck-review-gate` label, or the
      # half-hourly sweep. The reviewer runs this command on the head it just
      # reviewed, with GH_TOKEN, GH_REPO, PR and REPORT_SHA already exported.
      post-review-command: bash .github/scripts/review-findings-gate.sh
    secrets:
      # Rung 1 is the metered key the reviewer spends before any subscription
      # tier; the OAuth tiers keep this repository's own order behind it, so a
      # setup that configures only CLAUDE_CODE_OAUTH_TOKEN still reaches it on
      # the first subscription attempt. An unset rung is skipped, not a stop.
      rung_1: ${{ secrets.ANTHROPIC_API_KEY }}
      rung_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      rung_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      rung_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
      rung_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
      rung_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
      rung_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
      rung_8: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}

  # Auto-approve the PRs the reviewer deliberately SKIPS (see `review` above:
  # low-risk chore/style by title, machine-cut `release:` PRs, and
  # bot-authored PRs like Dependabot). Under a review-required ruleset the Claude
  # review IS the approval for the PRs it reads (looks_good -> APPROVE), so a class
  # it never reads would otherwise be stranded with no approving review and never
  # auto-merge. This posts that approval so the ruleset can let them through.
  # Draft PRs are excluded — they
  # can't merge anyway and get reviewed on `ready_for_review`. Fires only on the
  # first-look events (opened/ready_for_review), never on `synchronize`: it relies
  # on the ruleset NOT dismissing approvals on push (the same assumption the
  # reviewer makes by not re-reviewing every push).
  #
  # Title/author come from the event payload (set by GitHub, unspoofable by the
  # triggering actor). This posts a review only; it needs no checkout, runs no PR
  # code, and holds pull-requests:write and nothing else.
  auto-approve-skipped:
    name: Auto-approve low-risk and bot PRs the reviewer skips
    # The on-demand label re-arms this job, and it is an alternative to the
    # EVENT only. The approval fires once, on `opened` or `ready_for_review`. A
    # firing that fails leaves the PR with no approval and no second chance:
    # `synchronize` does not re-run this job, so a later push cannot recover it.
    # PR #176 stranded exactly that way, because GitHub refused the Actions
    # token its one firing used.
    #
    # The label sits INSIDE the conjunction, so the draft gate and the skip set
    # below still govern it. A label that was a top-level alternative would
    # approve any pull request a person labels — a draft, or a `feat:` whose
    # review is still open — and the posted approval says the reviewer skipped
    # it, which would then be false.
    if: >-
      (
      github.event.action == 'opened' ||
      github.event.action == 'ready_for_review' ||
      github.event.label.name == 'needs-auto-approve'
      ) &&
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.type == 'Bot' ||
        startsWith(github.event.pull_request.title, 'chore:') ||
        startsWith(github.event.pull_request.title, 'chore(') ||
        startsWith(github.event.pull_request.title, 'style:') ||
        startsWith(github.event.pull_request.title, 'style(') ||
        startsWith(github.event.pull_request.title, 'release:') ||
        startsWith(github.event.pull_request.title, 'release(')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse-checkout the trusted approval script
      pull-requests: write # submit an approving review; no other scope
    steps:
      - name: Checkout base (trusted) approval script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch only (trusted) — never the untrusted PR head, and
          # never base.ref, which a PR author can write. Matches the reviewer's
          # own posture: the script is trusted repo content, no PR code runs.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # The approver sources lib/review-skip-set.bash, which sources the
          # retry helper; a narrower list dies at the `source` under `set -e`.
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Approve so a review-required ruleset doesn't strand a skipped PR
        env:
          # GitHub refuses addPullRequestReview outright for an Actions token
          # ("GitHub Actions is not permitted to approve pull requests"), so the
          # default token reddens this job on every skipped PR. Take the same
          # candidates in the same order as the reviewer-hold approver below, the
          # sibling that approves the PRs the reviewer DOES read: a PAT acting as
          # a user is what makes the approval postable. Every candidate is an
          # identity this repository's owner controls, so the fallback trades away
          # capability, never which account acts. The script reports and stands
          # down when none of them can approve, so the PAT only ever upgrades this
          # step from "a human must approve" to "approved automatically".
          # token-fallback-ok: designed graceful degradation, not an accident.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/auto-approve-skipped-pr.sh

  # ────────────────────────────────────────────────────────────────────────────
  # Claude merge-delta review (Sonnet) — the `merge_delta_review` job
  #
  # A dedicated Sonnet reviewer for a PR's hand-authored MERGE-RESOLUTION deltas
  # (`git show --remerge-diff`) — the one channel through which a conflict
  # resolution can introduce content present in neither parent (an "evil merge")
  # that the ordinary PR diff never isolates. Separate from the first-pass
  # reviewer (the review job) and the thread-resolver: those read the net
  # diff and so share the blind spot this closes.
  #
  # SECURITY — same posture as the review job (see its header): a fork PR on
  # plain `pull_request` gets no secrets, so `pull_request_target` runs in the
  # trusted BASE context. To stay safe this workflow:
  #   1. checks out the BASE branch, never the untrusted PR head — no fork-authored
  #      code is checked out or executed;
  #   2. brings the PR head's commits in only as git OBJECTS (prepare-merge-delta-
  #      input.sh fetches refs/pull/N/head with per-command auth and never checks it
  #      out), renders the remerge-diff with the trusted base-checkout renderer, and
  #      sanitizes it before the model sees it — treated as untrusted DATA;
  #   3. holds least privilege — contents:read + pull-requests:write only, so even a
  #      successful injection can post a PR comment but cannot push, merge, or reach
  #      any other scope; the reviewer only ANALYZES and the post step is advisory.
  # Because pull_request_target always runs the workflow from the base branch, this
  # reviewer only takes effect once merged to the default branch.
  # ────────────────────────────────────────────────────────────────────────────
  merge_delta_review:
    name: Review the PR's merge-resolution deltas
    # Skip drafts (can't merge) and bot-authored PRs (never Claude-reviewed).
    if: >-
      contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One review per PR at a time; a newer push supersedes an in-flight run (latest
    # head wins). Keyed by PR number, so it never strands a required check.
    concurrency:
      group: claude-merge-delta-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the trusted base commit
      pull-requests: write # post the advisory comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base (trusted) branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch (trusted repo content), never the untrusted PR head
          # and never the author-writable base.ref — same rationale as the
          # review job. fetch-depth: 0 so the merge-base of the PR head
          # (fetched as objects) resolves.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the input sanitizer
        # Self-contained install (into .github/scripts/node_modules) so repos
        # synced from the template need no sanitizer entry in their own
        # package.json. --ignore-scripts keeps the install hermetic.
        run: bash .github/scripts/install-input-sanitizer.sh

      - name: Render and sanitize the merge-resolution deltas
        id: prepare
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/prepare-merge-delta-input.sh

      - name: Review the merge deltas with Claude (Sonnet)
        if: steps.prepare.outputs.has_deltas == 'true'
        uses: ./.github/actions/claude-run
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          # Give the action the workflow token directly. Without it, the action
          # tries to mint one via an OIDC→GitHub-App token exchange that isn't
          # authorized here and fails with "401 Invalid OIDC token" before Claude
          # runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Review outside-contributor PRs too; safe for the same reasons as the
          # first-pass reviewer (base-only checkout, least-privilege token,
          # sanitized data-only input).
          allowed_non_write_users: "*"
          model: claude-sonnet-5
          # Scoped for the reason the first-pass reviewer's grant spells out: a
          # bare Read or Write overrides the per-path check --add-dir relies on.
          claude_args: >-
            --setting-sources user
            --allowedTools "Read(./**),Read(/${{ runner.temp }}/pr-input/**),Edit(/${{ runner.temp }}/pr-input/merge-review.md)"
            --add-dir "${{ runner.temp }}/pr-input"
          prompt: |
            You are the merge-delta reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/prompts/claude-merge-delta-review.md — it is the
            single source of truth for how to review and the exact merge-review.md format.

            Write your review to ${{ runner.temp }}/pr-input/merge-review.md — nothing else.
            Do not post comments, resolve threads, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_files: |
            merge deltas: ${{ runner.temp }}/pr-input/merge-delta.txt

      - name: Post the advisory merge-delta review
        # Runs whenever prepare SUCCEEDED — including has_deltas=false — so a
        # sticky comment about a since-removed merge is refreshed to the clean
        # verdict rather than left stale. Skipped when prepare failed loud (an
        # octopus / renderer error), where the red job IS the signal.
        if: steps.prepare.conclusion == 'success'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/post-merge-delta-review.sh

  # ────────────────────────────────────────────────────────────────────────────
  # Claude review-thread resolver (Haiku) — the `thread_resolve` job
  #
  # On every push to a PR, check whether the new commits addressed the STILL-OPEN
  # review comments the Claude reviewer (the review job) left, using a cheap
  # Claude Haiku pass, and resolve each conversation Haiku judges addressed.
  # Complements the reviewer: the reviewer raises concerns and holds the merge; this
  # closes them out as the author fixes them, without a human clicking "Resolve
  # conversation" on each. The APPROVE that clears the hold once every reviewer
  # thread is resolved is a separate, state-based step (approve-if-reviewer-hold-
  # clear.sh) that runs on EVERY push regardless of what this run resolved, so a
  # thread resolved by a human or a prior race still clears the hold rather than
  # stranding the reviewer's CHANGES_REQUESTED; a thread-resolved event outside a
  # push is covered by claude-reviewer-hold-clear.yaml.
  #
  # SECURITY — same posture as the review job (see its header): a fork PR on
  # plain `pull_request` gets no secrets, so `pull_request_target` runs in the
  # trusted BASE context. To stay safe this workflow:
  #   1. checks out the BASE branch, never the untrusted PR head — no fork-authored
  #      code is checked out or executed;
  #   2. reads the PR's diff only as DATA, pre-sanitized through the
  #      agent-input-sanitizer, and the reviewer-thread bodies it acts on were
  #      authored by our own bot; the Haiku prompt treats both as untrusted input;
  #   3. holds least privilege — contents:read + pull-requests:write only, so even a
  #      successful injection can resolve/reply/approve on THIS PR but cannot push
  #      code, merge, or reach any other scope. The one broader credential — the PAT
  #      that actually resolves threads (the Actions GITHUB_TOKEN cannot, see the
  #      resolve step) — is confined to the deterministic resolve step's env and is
  #      NEVER exposed to the Haiku step, the only step that ingests untrusted PR
  #      data, so it stays out of reach of a model injection.
  # Because pull_request_target always runs the workflow from the base branch, this
  # resolver only takes effect once merged to the default branch.
  # ────────────────────────────────────────────────────────────────────────────
  thread_resolve:
    name: Resolve addressed review threads
    # Trigger identity preserved: this resolver ran ONLY on `synchronize` as a
    # standalone workflow, so the union's added opened/ready_for_review types
    # are excluded here by the action guard. Skip drafts (can't merge) and
    # bot-authored PRs (Dependabot et al. are handled elsewhere and are never
    # Claude-reviewed).
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One resolver per PR at a time; a newer push supersedes an in-flight run
    # (latest head wins). Keyed by PR number, so it never strands a required check.
    concurrency:
      group: claude-review-thread-resolve-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the trusted base branch
      pull-requests: write # resolve threads, reply, submit the approval
      statuses: write # re-derive the `Review findings resolved` verdict
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base (trusted) branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch (trusted repo content), never the untrusted PR head —
          # same rationale as the review job: base.ref is author-writable, and
          # base.sha would be a stale snapshot missing scripts that landed after
          # the PR opened. default_branch is neither.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Find unresolved reviewer threads
        id: threads
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/fetch-unresolved-review-threads.sh

      # A reviewer hold whose concern lives only in the review BODY opens no thread
      # for the resolver to close, so it would strand until a human dismisses it.
      # Detect it (only when there is no unresolved thread to work) so the Haiku
      # pass below can assess whether a later commit addressed the body finding,
      # and the approve step can then clear it.
      - name: Detect a thread-less reviewer body hold
        id: bodyhold
        if: steps.threads.outputs.has_threads != 'true'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/detect-reviewer-body-hold.sh

      - name: Install the input sanitizer
        if: steps.threads.outputs.has_threads == 'true' || steps.bodyhold.outputs.has_body_hold == 'true'
        # Self-contained install (into .github/scripts/node_modules) so the diff
        # can be sanitized before Haiku sees it, with no sanitizer entry needed
        # in the repo's own package.json.
        run: bash .github/scripts/install-input-sanitizer.sh

      - name: Fetch and sanitize the untrusted PR diff
        if: steps.threads.outputs.has_threads == 'true' || steps.bodyhold.outputs.has_body_hold == 'true'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/prepare-pr-review-input.sh

      - name: Judge which threads (and any body hold) are addressed (Claude Haiku)
        id: haiku
        if: steps.threads.outputs.has_threads == 'true' || steps.bodyhold.outputs.has_body_hold == 'true'
        uses: ./.github/actions/claude-run
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Haiku is enough for a per-thread yes/no "does the diff address this?"
          # judgement — far cheaper than the Opus reviewer that raises the concerns.
          model: claude-haiku-4-5-20251001
          # Scoped for the reason the first-pass reviewer's grant spells out: a
          # bare Read or Write overrides the per-path check --add-dir relies on.
          claude_args: >-
            --setting-sources user
            --allowedTools "Read(./**),Read(/${{ runner.temp }}/pr-input/**),Edit(/${{ runner.temp }}/pr-input/verdicts.json)"
            --add-dir "${{ runner.temp }}/pr-input"
          prompt: |
            You are the review-thread resolver for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/prompts/claude-review-thread-resolve.md — it is the
            single source of truth for how to judge and the exact verdicts.json format.

            Write your verdicts to ${{ runner.temp }}/pr-input/verdicts.json — nothing else.
            Do not resolve threads, post comments, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_files: |
            unresolved threads: ${{ runner.temp }}/pr-input/threads.json (may be an empty array)
            thread-less body hold: ${{ runner.temp }}/pr-input/body-hold.json (present ONLY for a body hold — {state, body}; judge whether the diff addresses that body finding)
            sanitized diff: ${{ runner.temp }}/pr-input/diff.txt
            sanitizer report: ${{ runner.temp }}/pr-input/sanitizer-report.txt

      - name: Tally this Haiku run's cost onto the review footnote
        if: steps.threads.outputs.has_threads == 'true' || steps.bodyhold.outputs.has_body_hold == 'true'
        # Runs on every Haiku pass (even one that resolves nothing), so the
        # footnote's running Haiku cost stays current. Independent of the
        # resolve step below.
        env:
          EXECUTION_FILE: ${{ steps.haiku.outputs.execution_file }}
        run: bash .github/scripts/append-haiku-cost.sh

      - name: Resolve the threads Haiku judged addressed
        if: steps.threads.outputs.has_threads == 'true'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          # resolveReviewThread is not available to the Actions GITHUB_TOKEN — it
          # can reply to a thread but a resolve returns "Resource not accessible by
          # integration" even with pull-requests:write, so resolving needs a PAT
          # acting as a user. The PAT is scoped to THIS step only, never the Haiku
          # step, so it is out of reach of a model injection. The ambient GH_TOKEN
          # (GITHUB_TOKEN) still posts the audit reply, keeping the
          # github-actions[bot] identity.
          #
          # Org secret first, then the per-repo one, then the built-in. Both PAT
          # spellings are load-bearing for different consumers: an org-owned repo
          # sets TEMPLATE_SYNC_TOKEN_ORG once for every repo it owns, while a
          # personal fork can only set a repo secret. Trying the org name first
          # means a downstream repo needs no edit either way.
          # Every candidate is an identity this repo's owner controls, so the
          # fallback trades away capability (a resolve the Actions token may not
          # perform), never which account acts.
          # token-fallback-ok: designed graceful degradation, not an accident.
          GH_RESOLVE_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-addressed-threads.sh

      # State-based, and deliberately NOT gated on has_threads: the approval is a
      # function of the CURRENT state (no unresolved reviewer thread remains + the
      # reviewer is still holding), so it clears the hold no matter who resolved
      # the last thread — the Haiku resolve above, a human clicking Resolve, or a
      # prior run. This closes the stranding gap where a thread resolved any other
      # way left the reviewer's CHANGES_REQUESTED with nothing to supersede it. No
      # `if:` = runs whenever the job reaches it (no earlier step failed),
      # including the has_threads==false path where the resolve step was skipped.
      - name: Approve if the reviewer's hold is now cleared
        env:
          # For a thread-less body hold, the approve script clears only on the
          # model's body verdict (.body.addressed). Threads clear on state alone,
          # so this file is irrelevant there; a missing/garbled file reads as
          # "not addressed" and defers. The hourly sweep sets no such file, so it
          # never clears a body hold — only this push-time assessor does.
          BODY_VERDICT_FILE: ${{ runner.temp }}/pr-input/verdicts.json
          # GitHub refuses addPullRequestReview outright for an Actions token
          # ("GitHub Actions is not permitted to approve pull requests"), the
          # approval-side sibling of the resolve restriction above. A PAT acting as
          # a user is what makes the approval postable, so this step takes the
          # same candidates in the same order as the resolve step — and the script
          # reports and stands down (rather than reddening the PR) when none of
          # them can approve, so the PAT only ever upgrades this step from "a
          # human must approve" to "approved automatically".
          # Every candidate is an identity this repo's owner controls, so the
          # fallback trades away capability, never which account acts.
          # token-fallback-ok: designed graceful degradation, not an accident.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/approve-if-reviewer-hold-clear.sh

      # Resolving a thread fires no workflow event of its own
      # (`pull_request_review_thread` is not a valid Actions `on:` event), so the
      # step above can clear the last gating finding and leave the required
      # `Review findings resolved` status red until the next push or the
      # half-hourly sweep. Re-derive it here, on the head this run resolved
      # against. `always()`: a failed approval is no reason to leave a cleared
      # gate red.
      - name: Re-derive the review-findings gate on this head
        if: always()
        env:
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/review-findings-gate.sh
