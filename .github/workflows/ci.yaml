name: CI

on:
  push:
    branches: [main]
  pull_request:

# Make the cancellation policy explicit (dogfoods check-concurrency).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and pnpm too, not only uv: the tests under tests/ that drive the
      # .github/scripts helpers run node and the pinned JS tools.
      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"
      - name: Lint (ruff)
        run: uv run --extra dev ruff check ci_truth_serum tests/cts
      - name: Format check (ruff)
        run: uv run --extra dev ruff format --check ci_truth_serum tests/cts
      # The whole tests/ tree, on every pull request: the tests of
      # .github/scripts sit beside the check pack's, and a path gate in front of
      # them skipped them exactly when a script they test changed.
      - name: Tests (pytest)
        run: uv run --extra dev pytest tests -n auto -q

  # Stable Required check: runs even when `test` is cancelled, so a protected
  # branch never gets stuck on a check that never reports.
  ci-passed: # required-check: true
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
