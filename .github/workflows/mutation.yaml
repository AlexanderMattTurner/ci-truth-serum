name: Mutation testing

# Mutation testing over the lint parsers (cosmic-ray, Python) and the changelog
# assembler (Stryker, JS). cosmic-ray reruns the offline suite once per mutant,
# so the Python side is SLICED: one shard per mutated hook module, fanned across
# runners, each mutant scoped to its module's own example suite (see
# .github/scripts/mutation_shards.py). Slices run in parallel so wall-clock is
# the slowest single module, not the serial sum, and an aggregate step demands
# one report per shard so a vanished slice can't score a subset as the whole.
# This runs on a DAILY schedule and on demand, never per pull request. One
# cosmic-ray pass reruns the offline suite once per mutant, so the cost is paid
# once a day against main rather than on every push to every branch. A mutant
# that survives is a prompt to add a test, and a prompt does not have to arrive
# before a merge to be worth acting on.
#
# The Python side is INCREMENTAL. Each shard caches its cosmic-ray session under
# a key that is a content hash of the shard's own inputs, so a run recomputes a
# mutant only when something it depends on changed and restores the rest. Each
# daily run therefore pays for the modules the day's merges touched.
#
# Both sides keep their decide-reusable path gates. With no pull_request event
# those gates open on every run this workflow has, so they cost a runner start
# and select nothing; they stay because the shards and the aggregate read their
# outputs, and rewiring that graph is a larger change than the schedule.
#
# Gate semantics: a shard fails only when its unmutated baseline is red or
# cosmic-ray errors — a surviving mutant is diagnostic, not a build break. The
# mutation-passed reporter is an `if: always()` summary so a run always reaches a
# conclusion. It is NOT a required check: a workflow with no pull_request trigger
# posts no status on a pull request, so requiring it would leave every pull
# request waiting on a check that never reports. A red daily run reaches a person
# through build-publish-notify.yaml's workflow_run notifier.

on:
  schedule:
    # cron-alert: false  # alerted repo-wide by build-publish-notify.yaml's workflow_run notifier, which check-failure-notifier-coverage holds exhaustive over every push/schedule workflow — this workflow has no in-workflow sink for this lint to credit
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      hypothesis_profile:
        description: Hypothesis profile for the property suites (dev = fast).
        type: string
        default: dev

concurrency:
  # The key is github.run_id, not github.ref: every run here is off a pull
  # request, so github.ref is the default branch for ALL of them and a ref key
  # would put them in one slot. cancel-in-progress would then let a manual
  # dispatch cancel the daily run whole, reporter included. run_id gives each run
  # its own slot, so nothing here cancels anything else.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path gates: each runs unconditionally so the mutation-passed reporter always
  # receives a conclusion, then opens only when files the matching side depends
  # on change on a PR (always open on non-pull_request events).
  decide-py:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/decide-reusable.yaml
    with:
      filters: |
        run:
          - 'ci_truth_serum/**'
          - 'tests/**'
          - 'cosmic-ray.toml'
          - 'pyproject.toml'
          - 'uv.lock'
          - '.python-version'
          - '.github/scripts/run-mutation.sh'
          - '.github/scripts/run-mutation-shard.sh'
          - '.github/scripts/mutation_shards.py'
          - '.github/scripts/aggregate-mutation.py'
          - '.github/actions/setup-uv/**'
          - '.github/workflows/mutation.yaml'
          - '.github/workflows/decide-reusable.yaml'

  decide-js:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/decide-reusable.yaml
    with:
      filters: |
        run:
          - 'scripts/*.mjs'
          # The suite stryker runs drives markdownlint through this config, so
          # a change to it must re-run the mutation gate.
          - '.markdownlint-cli2.jsonc'
          - 'stryker.config.json'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - '.github/actions/setup-base-env/**'
          - '.github/actions/setup-uv/**'
          - '.github/workflows/mutation.yaml'
          - '.github/workflows/decide-reusable.yaml'

  # Expand the shard matrix from the committed tree (one shard per mutated hook
  # module). The aggregate job re-derives the same set from the same checkout, so
  # their shard counts are guaranteed identical — the gate can never score a subset.
  plan:
    needs: decide-py
    if: needs.decide-py.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute shard matrix
        id: shards
        run: echo "shards=$(python3 .github/scripts/mutation_shards.py)" >> "$GITHUB_OUTPUT"

  # One shard per mutated module, in parallel. Each runs cosmic-ray over its one
  # module with the per-mutant oracle scoped to that module's example suite, and
  # uploads reports/mutation/<id>.json. Break-disabled by design: a survivor is
  # diagnostic, so a shard fails only on a red baseline or a cosmic-ray error.
  mutation:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          install-python: "true"

      # Incremental mutation testing. The key is a content hash of everything
      # that can change one of this shard's verdicts (mutation_shards.py's
      # shard_hash), so a hit means the session was computed from this exact
      # tree and run-mutation-shard.sh resumes it instead of re-running every
      # mutant. No restore-keys, deliberately: cosmic-ray records a verdict per
      # mutant and cannot re-validate one, so a near-miss session would score
      # stale verdicts as current. The weekly cron run seeds these caches on
      # main, which is the only scope a fresh pull request can read.
      - name: Restore this shard's cosmic-ray session
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cr-${{ matrix.shard.id }}.sqlite
          key: cosmic-ray-${{ matrix.shard.id }}-${{ matrix.shard.hash }}

      - name: Run mutation shard
        env:
          SHARD_ID: ${{ matrix.shard.id }}
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_TOTAL: ${{ matrix.shard.total }}
          HYPOTHESIS_PROFILE: ${{ inputs.hypothesis_profile || 'dev' }}
        run: uv run --extra mutation bash .github/scripts/run-mutation-shard.sh

      - name: Upload shard report
        if: ${{ always() && hashFiles(format('reports/mutation/{0}.json', matrix.shard.id)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.shard.id }}
          path: reports/mutation/${{ matrix.shard.id }}.json
          if-no-files-found: error
          retention-days: 14

  # Demand exactly one report per shard (from the same expander the matrix used)
  # and print the per-shard survival rates. This is the coverage gate; the shards
  # themselves never fail on survivors.
  aggregate: # required-check: false  # rolled up by mutation-passed (which needs: aggregate)
    needs: [decide-py, plan, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ran` is the only condition under which reports are owed. The gate has to
      # be open AND the expander has to have produced the matrix: when plan fails
      # (an oracle is missing, or the matrix outgrew GitHub's job limit) the shard
      # job is skipped, and demanding reports here would bury plan's message under
      # a missing-directory error.
      - name: Decide whether reports are owed
        id: owed
        env:
          GATE: ${{ needs.decide-py.outputs.run }}
          PLAN: ${{ needs.plan.result }}
        run: |
          ran=false
          if [[ "${GATE}" == "true" && "${PLAN}" == "success" ]]; then
            ran=true
          else
            echo "::notice::No mutation shards ran (gate=${GATE}, plan=${PLAN}), nothing to aggregate"
          fi
          echo "ran=${ran}" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.owed.outputs.ran == 'true'
        with:
          persist-credentials: false

      - name: Download shard reports
        if: steps.owed.outputs.ran == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-*
          path: shard-reports

      # aggregate-mutation.py is stdlib-only (json + tomllib); ubuntu-latest ships
      # Python 3.12, so no toolchain setup is needed to enforce the coverage gate.
      - name: Aggregate and enforce one report per shard
        if: steps.owed.outputs.ran == 'true'
        run: python3 .github/scripts/aggregate-mutation.py shard-reports

  # JS counterpart: Stryker over the self-contained scripts/assemble-changelog.mjs.
  mutation-js:
    needs: decide-js
    if: needs.decide-js.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Stryker
        run: pnpm mutation

  # Runs even when the gates close or a job is cancelled or skipped, so every
  # run reaches one conclusion a person can read.
  mutation-passed: # required-check: false  # no pull_request trigger, so this posts no status on a pull request and cannot gate one
    if: always()
    needs: [decide-py, decide-js, plan, mutation, aggregate, mutation-js]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
