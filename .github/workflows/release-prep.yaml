name: Release prep (pre-merge version bump)

# When a PR is labeled `release`, classify the pending changelog.d/ fragments as
# a conservative semver bump (patch or minor — never major) and commit the
# package.json bump + assembled CHANGELOG roll onto the PR branch. The bump then merges
# as part of the PR, so main's latest commit stays the real merge/squash commit.
# The matching vX.Y.Z tag is created post-merge by tag-release.yaml.

on:
  # not-required-check: advisory label-gated release automation, never a required
  # status check — the branches: [main, master] scoping is deliberate.
  pull_request: # not-required-check
    types: [labeled]
    branches: [main, master]

concurrency:
  group: release-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Conservative version bump on the PR branch
    if: github.event.label.name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        # Credentials stay persisted: release-prep.sh pushes the bump commit with them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # An org PAT lets the bump commit land on the PR branch (and clears
          # branch protection) from an account with write access to this repo —
          # a personal PAT for a different account pushes as its owner and 403s.
          # Falls back to GITHUB_TOKEN when the org PAT is unset.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Bump version on the PR branch
        # Every rung of the credential ladder in bin/lib/release-model-call.bash,
        # passed as separate env vars rather than one var holding a `||` fallback
        # expression: the script tries them in order and logs WHICH one answered,
        # and an unconfigured secret arrives as an empty var the ladder skips.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # This job holds secrets and write access, so it must not execute
        # PR-controlled code: it runs the base branch's trusted copies of the
        # release script, the changelog assembler, and the shell libraries it
        # sources — not the PR's. That staging is what release-prep-bump-version.sh
        # does, so the bootstrap MUST be staged the same way: invoking it as
        # `bash .github/scripts/release-prep-bump-version.sh` would read the first
        # bytes this job executes out of the PR's own checkout, handing the PR
        # author the PAT and the model credentials above. This block is inline
        # because a workspace script call is precisely the hole it closes; the
        # workflow file itself is read from the base ref, so its `run:` is trusted.
        # trusted-base-ok: privileged job runs only the base branch's trusted
        # script copies, never the PR-controlled checkout.
        run: |
          set -euo pipefail
          boot=.github/scripts/release-prep-bump-version.sh
          git fetch --quiet origin "$BASE_REF"
          # Missing on base only for the PR that first adds it (bootstrap).
          if git show "FETCH_HEAD:${boot}" >"${RUNNER_TEMP}/bump.sh" 2>/dev/null; then
            bash "${RUNNER_TEMP}/bump.sh"
          else
            echo "::warning::base branch lacks ${boot}; running the PR's copy (bootstrap only)"
            bash "$boot"
          fi
