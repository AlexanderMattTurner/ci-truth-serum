name: Tag release (post-merge)

# After a push to the default branch, push a vX.Y.Z tag when this push advanced
# package.json's version and the tag is missing, then publish the GitHub
# Release with that version's CHANGELOG section as notes. The pre-merge bump
# rides in via release-prep.yaml; this only adds the tag and release, neither
# of which appears as the latest commit, so main's visible head stays the real
# merge/squash commit.

on:
  push:
    branches: [main, master]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag the merged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Credentials stay persisted: tag-release.sh pushes the tag with them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          # Need HEAD~1 to detect a version change in this push.
          fetch-depth: 2
          # An org PAT lets the tag push clear any tag protection and, unlike a
          # personal PAT, belongs to an account with write access to this repo
          # (a user PAT for a different account pushes as its owner and 403s);
          # falls back to GITHUB_TOKEN when the org PAT is unset.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag and publish the release if the version advanced
        env:
          # gh needs a token for `release view`/`release create`; same org PAT
          # fallback as the checkout so tag protection rules don't differ
          # between the tag push and the release.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG || github.token }}
        run: bash .github/scripts/tag-release.sh

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          install-python: "true"

      # The release verifier this package ships, run on the release path it
      # describes. It sits AFTER tagging because it compares the markers a cut
      # release leaves behind (the `v*` tag and the changelog's top dated
      # heading), so before the tag exists there is nothing to agree. It lives
      # in THIS job because this workflow's failures already reach a human:
      # build-publish-notify.yaml watches "Tag release (post-merge)" by name and
      # grades it priority 5. A canary in a workflow nobody watches is the
      # defect that let this one sit unrun.
      - name: Verify the release version markers agree
        run: bash .github/scripts/release-canary.sh
