      - name: Download pinned gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          # A restored cache entry is never trusted on its own. The post-job save
          # runs even when a download failed, so an entry can hold a truncated
          # binary. Probe what the binary reports, not whether the file is there.
          if [[ "$(./gitleaks version 2>/dev/null)" == "${GITLEAKS_VERSION}" ]]; then
            echo "gitleaks ${GITLEAKS_VERSION} restored from cache"
            exit 0
          fi
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
            -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/gitleaks-scan.sh

  # Stable Required check: runs even when `gitleaks` is cancelled/skipped, so a
  # protected branch never gets stuck on a check that never reports.
  gitleaks-passed: # required-check: true
    if: always()
    needs: [gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/report-job-result
            .github/scripts
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: "true"
          decide-result: "success"
          result: ${{ needs.gitleaks.result }}
