name: Phone Home Improvements

# When a PR is merged that contains a "Lessons Learned" section,
# this workflow opens an issue on the template repository so the
# improvement can be adopted across all downstream projects.

on:
  pull_request:
    types: [closed]

env:
  TEMPLATE_REPO: "${{ vars.TEMPLATE_SYNC_ORG || 'alexander-turner' }}/claude-automation-template"
  # One value for all three consumers: the extract step writes lessons.txt here,
  # the gitleaks scan reads this directory, the submit step reads the file back.
  PHONE_HOME_DIR: /tmp/phone-home

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phone-home:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Extract lessons from PR body
        id: extract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.github/scripts/phone-home-extract.js')
            await run({github, context, core})

      - name: Scan lessons for leaked secrets
        if: steps.extract.outputs.has_lessons == 'true'
        env:
          GITLEAKS_DEST: /usr/local/bin
        run: |
          bash .github/scripts/install-gitleaks.sh
          gitleaks detect --no-git -s "$PHONE_HOME_DIR" -v

      - name: Submit to template repo
        if: steps.extract.outputs.has_lessons == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          PR_TITLE: ${{ steps.extract.outputs.pr_title }}
          PR_URL: ${{ steps.extract.outputs.pr_url }}
          SOURCE_REPO: ${{ steps.extract.outputs.source_repo }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const run = require('./.github/scripts/phone-home-submit.js')
            await run({github, context, core})
