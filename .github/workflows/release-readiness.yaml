name: Release readiness check

# Has the default branch accumulated enough user-facing change since the last
# release to merit cutting a new vX.Y.Z release? Claude weighs the pending
# changelog.d/ fragments (security fixes, features, fix volume, cadence) and
# writes a verdict to the job summary. When a release IS warranted it cuts one
# directly: bumps package.json, rolls the CHANGELOG, commits that, and pushes the
# commit straight to the default branch — no PR, because the commit only advances
# the version and folds in fragments a reviewer already read. tag-release.yaml
# fires on that push and cuts the tag. The push rides TEMPLATE_SYNC_TOKEN_ORG,
# which must be allowed to bypass the default branch's pull-request rule.
# release-prep.yaml is the parallel HUMAN path (a maintainer labels a hand-made
# PR); the shared `release` label makes an open release PR stand this path down,
# so the two never cut colliding releases.

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether HEAD merits a release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit to the default branch
      pull-requests: read # the concurrent-release probe (gh pr list) + the label it filters on
      issues: write # open/close the release-failure tracking issue (see the final steps)
    steps:
      - name: Checkout
        # Credentials stay persisted: cut_release pushes the release commit with
        # them. The org PAT, never GITHUB_TOKEN, for two reasons. A push that
        # GITHUB_TOKEN makes starts no workflow, so tag-release.yaml would never
        # fire and the new version would stay untagged. The default branch also
        # requires a pull request, and only the PAT's identity may bypass that
        # rule. Without the secret the push is refused, and release-readiness.sh
        # says so instead of retrying.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # Full history so the release commit rebases onto the branch tip when a
          # push lands between this run's checkout and its own push.
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Assess release readiness with Claude
        # Every rung of the credential ladder in bin/lib/release-model-call.bash,
        # passed as separate env vars rather than one var holding a `||` fallback
        # expression: the script tries them in order and logs WHICH one answered,
        # and an unconfigured secret arrives as an empty var the ladder skips.
        # A ladder that runs dry IS fatal here: this path pushes the release with
        # no human in between, so the script cuts nothing without a verdict.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          # Same org PAT as the checkout (see that step). gh reads it for the
          # `release` label and the concurrent-release probe.
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN_ORG }}
        # tee the combined output so the failure step can quote the real reason in
        # the tracking issue. pipefail keeps the script's exit code across the tee.
        run: |
          set -o pipefail
          bash .github/scripts/release-readiness.sh 2>&1 | tee "$RUNNER_TEMP/release-readiness.log"

      # Keep a single tracking issue in sync with the run's health: open (or
      # comment on) one when the run failed — a broken release pipeline that only
      # shows as a red scheduled run went unnoticed for days — and close it on the
      # next success. Both are best-effort notification, so neither is allowed to
      # change the job's real conclusion.
      - name: Open a tracking issue if the release run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LOG: ${{ runner.temp }}/release-readiness.log
        run: bash .github/scripts/manage-release-failure-issue.sh open

      - name: Resolve the tracking issue on a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/manage-release-failure-issue.sh resolve
