  hook-lifecycle:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"

      # path-gate-ok: .github/scripts/run-hook-lifecycle.sh the decide job watches it through shell-targets, which derives it and everything it reaches; the checker reads paths-regex only
      - name: Run hook lifecycle
        run: bash .github/scripts/run-hook-lifecycle.sh

  # Stable Required check: runs even when `hook-lifecycle` is cancelled/skipped,
  # so a protected branch never gets stuck on a check that never reports.
  hook-lifecycle-passed: # required-check: true
    if: always()
    needs: [decide, hook-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
